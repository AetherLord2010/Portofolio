<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Login</title>
  <style>
    *{
      text-decoration: none;
      margin: 0;
      padding: 0;
      text-align: center;
      justify-content: center;
    }
    body{
      background: gray;
      margin: 0;
      padding: 0;
      text-align: center;
      justify-content: center;
      display: flex;
      align-items: center;
    }
    
    .content{
      margin-block: -500px;
      position: fixed;
      background-color: transparent;
      align-items: center;
      background: white;
      justify-content: center;
      text-align: center;
      padding: 20px;
      margin-top: 400px;
      border-radius: 3rem;
      box-shadow:1px 8px 16px rgba(0,0,0,1);
    }
    
    header{
      background-color: blue;
      border-radius: 3px;
      color: white;
    }
    
    .img-container{
      position: fixed;
      margin: 0;
      top: 0;
      left: 0;
      background-color: transparent;
    }
    
    img{
      display: flex;
      width: 100%;
      height: 140vh;
      background-color: transparent;
    }
    
    
    .menu{
      margin-top: 80px;
      padding: 2px;
      display: flex;
      justify-content: center;
      text-align: center;
      height: 20px;
    }
    
    .menu1{
      margin:3px;
      padding: 2px;
      display: flex;
      justify-content: center;
      text-align: center;
      height: 20px;
    }
    .menu2{
      margin:40px;
      padding: 2px;
      display: flex;
      justify-content: center;
      text-align: center;
      background-color: white;
      border-radius: 5rem;
      border: 3px solid Blue;
      font-size: 15px;
      transition: 1s;
      cursor: pointer;
      color: white;
      text-decoration: none;
    }
    
    
  </style>
</head>
<body>
  
  <div class="img-container">
    <img src="bg.jpg" alt="" class="img">
  </div>
  
  
  <div class="content">
  <header>
    <h1>Login</h1>
  </header>
  <div class="menu">
    <label for="name" id="name">Username</label>
    <input type="username" id="name" name="username">
  </div>
    <div class="menu1">
      <label for="pw">Password</label>
    <input type="password" id="pw" password="password">
  </div>
  <div class="menu2">
<a href="yoga.html" class="Btn">Submit</a>
  </div>
  </div>
  
</body>
</html>
